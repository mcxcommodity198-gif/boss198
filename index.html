<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@500;700&display=swap');

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  :root {
    --gold: #f0b429;
    --gold-light: #fcd34d;
    --tg: #2AABEE;
    --dark: #0a0a0f;
  }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--dark);
    color: #fff;
    height: 100vh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .bg {
    position: absolute;
    inset: 0;
    background: 
      radial-gradient(circle at 30% 20%, rgba(42, 171, 238, 0.15) 0%, transparent 45%),
      radial-gradient(circle at 70% 80%, rgba(240, 180, 41, 0.12) 0%, transparent 45%),
      linear-gradient(135deg, #0a0a0f 0%, #111118 100%);
    z-index: 0;
  }

  .particles {
    position: absolute;
    inset: 0;
    z-index: 1;
    overflow: hidden;
  }

  .particle {
    position: absolute;
    width: 3px;
    height: 3px;
    background: var(--gold);
    border-radius: 50%;
    opacity: 0.5;
    animation: float 14s infinite linear;
  }

  @keyframes float {
    0% { transform: translateY(100vh) scale(0); opacity: 0; }
    15% { opacity: 0.6; }
    85% { opacity: 0.3; }
    100% { transform: translateY(-20vh) scale(1); opacity: 0; }
  }

  .container {
    position: relative;
    z-index: 10;
    width: 100%;
    max-width: 620px;
    padding: 0 24px;
    text-align: center;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(42, 171, 238, 0.15);
    border: 1px solid rgba(42, 171, 238, 0.3);
    color: #7dd3fc;
    font-size: 13px;
    font-weight: 500;
    padding: 8px 18px;
    border-radius: 50px;
    margin-bottom: 32px;
    opacity: 0;
    animation: fadeUp 0.7s ease forwards 0.2s;
  }

  .badge svg {
    width: 16px;
    height: 16px;
  }

  h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(2.4rem, 7vw, 3.6rem);
    font-weight: 700;
    line-height: 1.15;
    margin-bottom: 18px;
    opacity: 0;
    animation: fadeUp 0.8s ease forwards 0.35s;
  }

  h1 span {
    background: linear-gradient(90deg, #fff, var(--gold-light), #fff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-size: 200% auto;
    animation: shine 4s linear infinite;
  }

  @keyframes shine {
    to { background-position: 200% center; }
  }

  .subtitle {
    font-size: 1.1rem;
    color: rgba(255,255,255,0.65);
    line-height: 1.6;
    margin-bottom: 40px;
    opacity: 0;
    animation: fadeUp 0.8s ease forwards 0.5s;
  }

  .tg-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: linear-gradient(135deg, #2AABEE, #229ED9);
    color: white;
    font-size: 17px;
    font-weight: 600;
    padding: 18px 42px;
    border-radius: 60px;
    text-decoration: none;
    box-shadow: 0 10px 30px rgba(42, 171, 238, 0.4);
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    opacity: 0;
    animation: fadeUp 0.8s ease forwards 0.65s;
    position: relative;
    overflow: hidden;
  }

  .tg-btn:hover {
    transform: translateY(-4px) scale(1.03);
    box-shadow: 0 16px 40px rgba(42, 171, 238, 0.55);
  }

  .tg-btn svg {
    width: 24px;
    height: 24px;
  }

  .tg-btn::after {
    content: '';
    position: absolute;
    inset: -4px;
    border-radius: 60px;
    border: 2px solid rgba(42, 171, 238, 0.5);
    animation: pulse 2s infinite;
    opacity: 0;
  }

  @keyframes pulse {
    0% { transform: scale(1); opacity: 0.6; }
    100% { transform: scale(1.15); opacity: 0; }
  }

  .note {
    margin-top: 28px;
    font-size: 14px;
    color: rgba(255,255,255,0.4);
    opacity: 0;
    animation: fadeUp 0.8s ease forwards 0.8s;
  }

  @keyframes fadeUp {
    from {
      opacity: 0;
      transform: translateY(28px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @media (max-width: 480px) {
    .tg-btn {
      width: 100%;
      padding: 16px 24px;
    }
  }
</style>

<body>
  <div class="bg"></div>
  <div class="particles" id="particles"></div>

  <div class="container">
    <div class="badge">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.894 8.221l-1.97 9.28c-.145.658-.537.818-1.084.508l-3-2.21-1.447 1.394c-.14.18-.357.295-.6.295-.002 0-.003 0-.005 0l.213-3.054 5.56-5.022c.24-.213-.054-.334-.373-.121l-6.869 4.326-2.96-.924c-.64-.203-.658-.64.136-.954l11.566-4.458c.538-.196 1.006.128.832.941z"/>
      </svg>
      Official Channel
    </div>

    <h1>Join My<br><span>Telegram Channel</span></h1>

    <p class="subtitle">
      Get exclusive updates, signals & alpha directly in your Telegram.<br>
      Don’t miss what’s coming next.
    </p>

    <a href="https://t.me/+75OlsfgZC3ozNDY1" class="tg-btn" target="_blank">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.894 8.221l-1.97 9.28c-.145.658-.537.818-1.084.508l-3-2.21-1.447 1.394c-.14.18-.357.295-.6.295-.002 0-.003 0-.005 0l.213-3.054 5.56-5.022c.24-.213-.054-.334-.373-.121l-6.869 4.326-2.96-.924c-.64-.203-.658-.64.136-.954l11.566-4.458c.538-.196 1.006.128.832.941z"/>
      </svg>
      Join Channel Now
    </a>

    <p class="note">Free • Instant access • No spam</p>
  </div>

<script>
  const particlesContainer = document.getElementById('particles');
  for (let i = 0; i < 35; i++) {
    const p = document.createElement('div');
    p.classList.add('particle');
    p.style.left = Math.random() * 100 + '%';
    p.style.width = p.style.height = (Math.random() * 3 + 1.5) + 'px';
    p.style.animationDelay = Math.random() * 12 + 's';
    p.style.animationDuration = (9 + Math.random() * 10) + 's';
    if (Math.random() > 0.6) p.style.background = '#2AABEE';
    particlesContainer.appendChild(p);
  }
</script>
</body>
</html>
